name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 09:00 UTC every 3 days (Supabase pauses free tier after 7 days of inactivity)
    - cron: "0 9 */3 * *"
  workflow_dispatch:

jobs:
  keepalive:
    name: Supabase Keep-Alive Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY is missing or empty. Please add them under GitHub Repo Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi
          curl -sf "${SUPABASE_URL%/}/rest/v1/projects?select=*&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
